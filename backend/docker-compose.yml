services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - ./migration/scema_user.sql:/docker-entrypoint-initdb.d/scema.sql
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
          test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
          interval: 5s
          timeout: 5s
          retries: 5